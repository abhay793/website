# Render Infrastructure as Code configuration
# This file defines the services needed for the PHP application
# FREE TIER: Web Service (spins down) + PostgreSQL (1GB, 90 days)

services:
  # Web Service - PHP Application
  - type: web
    name: meridian-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Pre-deploy command to initialize database schema
    preDeployCommand: "php init-db.php"
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: "Ocktova"
      - key: SESSION_TIMEOUT_SECONDS
        value: "1800"
      # Database credentials - AUTO-INJECTED from PostgreSQL service below
      - key: DB_HOST
        fromDatabase:
          name: meridian-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: meridian-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: meridian-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: meridian-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: meridian-db
          property: password
      - key: DB_DRIVER
        value: "pgsql"
    healthCheckPath: /index.php
    autoDeploy: true

  # Managed PostgreSQL Database (Render FREE TIER)
  - type: pserv
    name: meridian-db
    plan: free
    # version, databaseName, and user are optional - Render will use defaults
