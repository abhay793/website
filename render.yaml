# Render Infrastructure as Code configuration
# This file defines the services needed for the PHP application

services:
  # Web Service - PHP Application
  - type: web
    name: meridian-web
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    # Pre-deploy command to initialize database schema
    # This runs before the new version is deployed
    preDeployCommand: "php init-db.php"
    envVars:
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: "Ocktova"
      - key: SESSION_TIMEOUT_SECONDS
        value: "1800"
      # Database credentials - SET THESE IN RENDER DASHBOARD AFTER DEPLOY
      # Use an external MySQL provider (PlanetScale, Railway, Aiven, Supabase, etc.)
      - key: DB_HOST
        value: "" # e.g., "aws.connect.psdb.cloud" or "mysql-xxxx.railway.app"
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "corporate_site"
      - key: DB_USER
        value: "" # your database username
      - key: DB_PASS
        value: "" # your database password
      - key: DB_CHARSET
        value: "utf8mb4"
    # Health check endpoint
    healthCheckPath: /index.php
    # Auto-deploy on push to main
    autoDeploy: true

# NOTE: Render's managed database (pserv) only supports PostgreSQL.
# For MySQL, use an external provider and set the env vars above in Render Dashboard.
# See EXTERNAL_MYSQL_PROVIDERS.md for options.
