version: '3.8'

services:

  # PHP + Apache — runs your .php files (client/, includes/, etc.)
  web:
    image: php:8.2-apache
    container_name: meridian_web
    ports:
      - "8080:80"
    volumes:
      - ./project:/var/www/html
    depends_on:
      - db
    # Installs the mysqli/pdo_mysql extension PHP needs to talk to MySQL
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql mysqli
      && apache2-foreground"

  # MySQL — this is your actual database storage
  db:
    image: mysql:8.0
    container_name: meridian_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: corporate_site
      MYSQL_USER: db_username
      MYSQL_PASSWORD: db_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./project/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # phpMyAdmin — visual tool to view/manage your database in browser
  phpmyadmin:
    image: phpmyadmin
    container_name: meridian_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: db_username
      PMA_PASSWORD: db_password
    depends_on:
      - db

volumes:
  db_data:
