version: '3.8'

services:

  # PHP + Apache — runs your .php files (client/, includes/, etc.)
  web:
    image: php:8.2-apache
    container_name: meridian_web
    ports:
      - "8080:80"
    volumes:
      - ./project:/var/www/html
    depends_on:
      - db
    # Installs the pdo_pgsql extension PHP needs to talk to PostgreSQL
    command: >
      bash -c "docker-php-ext-install pdo pdo_pgsql
      && apache2-foreground"
    environment:
      - DB_DRIVER=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=corporate_site
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_CHARSET=utf8

  # PostgreSQL — this is your actual database storage
  db:
    image: postgres:16
    container_name: meridian_db
    restart: always
    environment:
      POSTGRES_DB: corporate_site
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./project/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # pgAdmin — visual tool to view/manage your database in browser
  pgadmin:
    image: dpage/pgadmin4
    container_name: meridian_pgadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  db_data:
